# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build

services:
  mongo:
    # Прод-сервер без AVX (старый Xeon/VM): MongoDB 5+ падает с Illegal instruction.
    # В образе 4.4 шелл — `mongo`, не `mongosh`. Не поднимайте 7-ку на этот volume:
    # данные 4.4 нельзя открыть семёркой напрямую.
    image: mongo:4.4
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  mailpit:
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  backend:
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-01.03.1986}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-Админ}
      - ADMIN_ROLE=${ADMIN_ROLE:-admin}
      - SEED_DEV_DATA=${SEED_DEV_DATA:-false}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_FROM=${SMTP_FROM:-Пропуск.М-Стиль <pass@mstyle.ru>}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:pass@mstyle.ru}
      - SMSAERO_EMAIL=${SMSAERO_EMAIL:-}
      - SMSAERO_API_KEY=${SMSAERO_API_KEY:-}
      - SMSAERO_SIGN=${SMSAERO_SIGN:-SMS Aero}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - SMSAERO_CALLBACK_URL=${SMSAERO_CALLBACK_URL:-}
      - MSTYLE_SMS_ENABLED=${MSTYLE_SMS_ENABLED:-false}
      - MSTYLE_SMSAERO_EMAIL=${MSTYLE_SMSAERO_EMAIL:-}
      - MSTYLE_SMSAERO_API_KEY=${MSTYLE_SMSAERO_API_KEY:-}
      - MSTYLE_SMSAERO_SIGN=${MSTYLE_SMSAERO_SIGN:-}
      - MSTYLE_SMSAERO_CALLBACK_URL=${MSTYLE_SMSAERO_CALLBACK_URL:-}
      - MSTYLE_PRIVATE_API_ENABLED=${MSTYLE_PRIVATE_API_ENABLED:-false}
      - MSTYLE_CLIENT_ID=${MSTYLE_CLIENT_ID:-mstyle-backend-prod}
      - MSTYLE_CLIENT_AUTH=${MSTYLE_CLIENT_AUTH:-private_key_jwt}
      - MSTYLE_CLIENT_KID=${MSTYLE_CLIENT_KID:-mstyle-backend-prod-20260823-01}
      - MSTYLE_CLIENT_PUBLIC_KEY=${MSTYLE_CLIENT_PUBLIC_KEY:-}
      - MSTYLE_CLIENT_PUBLIC_KEY_FILE=${MSTYLE_CLIENT_PUBLIC_KEY_FILE:-/app/config/oauth-public-keys/mstyle-backend-prod-20260823-01-public.pem}
      - MSTYLE_CLIENT_SCOPES=${MSTYLE_CLIENT_SCOPES:-mstyle.guest.booking.confirm mstyle.guest.create mstyle.guest.read mstyle.guest.claim mstyle.guest.contact.read mstyle.guest.private.reveal mstyle.guest.snapshot.contact.reveal mstyle.guest.snapshot.private.reveal mstyle.integration.admin.members.read mstyle.integration.admin.profile.read mstyle.integration.admin.profile.write mstyle.integration.admin.identity.read mstyle.integration.admin.physical_access.read mstyle.integration.admin.change_request.decide mstyle.integration.admin.guest.read mstyle.integration.admin.onboarding.write mstyle.resident.authenticate mstyle.resident.consent.read mstyle.resident.consent.write mstyle.resident.contact.read mstyle.resident.contact.write mstyle.resident.context.read mstyle.resident.identity.write mstyle.resident.members.read mstyle.resident.members.write mstyle.resident.private.reveal mstyle.resident.private.status.read mstyle.resident.private.write mstyle.resident.profile.read mstyle.resident.profile.write mstyle.resident.snapshot.create mstyle.resident.snapshot.contact.reveal mstyle.resident.snapshot.private.reveal mstyle.resident.physical_access.read mstyle.resident.change_request.read mstyle.resident.change_request.write mstyle.snapshot.operation.bind}
      - MSTYLE_ADMIN_ASSERTION_SECRET=${MSTYLE_ADMIN_ASSERTION_SECRET:-}
      - MSTYLE_RECONCILE_CLIENT_ID=${MSTYLE_RECONCILE_CLIENT_ID:-mstyle-reconcile-prod}
      - MSTYLE_RECONCILE_CLIENT_AUTH=${MSTYLE_RECONCILE_CLIENT_AUTH:-private_key_jwt}
      - MSTYLE_RECONCILE_CLIENT_KID=${MSTYLE_RECONCILE_CLIENT_KID:-mstyle-reconcile-prod-20260823-01}
      - MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY=${MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY:-}
      - MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY_FILE=${MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY_FILE:-/app/config/oauth-public-keys/mstyle-reconcile-prod-20260823-01-public.pem}
      - OAUTH_CLIENT_PUBLIC_KEYS_DIR=${OAUTH_CLIENT_PUBLIC_KEYS_DIR:-/app/config/oauth-public-keys}
      - MSTYLE_PII_KEY=${MSTYLE_PII_KEY:-}
      - MSTYLE_IDEMPOTENCY_SECRET=${MSTYLE_IDEMPOTENCY_SECRET:-}
      - MSTYLE_MOCK_RESPONSES=${MSTYLE_MOCK_RESPONSES:-false}
      - MSTYLE_DISPATCH_ENABLED=${MSTYLE_DISPATCH_ENABLED:-false}
      - MSTYLE_MOCK_OTP=${MSTYLE_MOCK_OTP:-1234}
      - MSTYLE_ENVIRONMENT=${MSTYLE_ENVIRONMENT:-production}
      - MSTYLE_CONSENT_DOCUMENTS_JSON=${MSTYLE_CONSENT_DOCUMENTS_JSON:-[]}
      - MSTYLE_CLIENT_JWT_ALG=${MSTYLE_CLIENT_JWT_ALG:-RS256}
      - MSTYLE_CLIENT_ADMIN_ALLOWED=${MSTYLE_CLIENT_ADMIN_ALLOWED:-true}
      - MSTYLE_RECONCILE_JWT_ALG=${MSTYLE_RECONCILE_JWT_ALG:-RS256}
      - MSTYLE_PRIVATE_API_BASE=${MSTYLE_PRIVATE_API_BASE:-}
      - MSTYLE_PUBLIC_BASE_URL=${MSTYLE_PUBLIC_BASE_URL:-${PUBLIC_APP_URL}}
      # Пусто по умолчанию — update.sh без --profile telegram не ходит на wireguard.
      # Когда поднят profile telegram: TELEGRAM_GATEWAY_URL=http://wireguard:8091
      - TELEGRAM_GATEWAY_URL=${TELEGRAM_GATEWAY_URL:-}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      - MSTYLE_TELEGRAM_BOT=${MSTYLE_TELEGRAM_BOT:-m_style_office_bot}

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL}
