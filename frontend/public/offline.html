<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#323232" />
    <title>Нет связи — Пропуска</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #323232;
        color: #ececec;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #b8b8b8;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #eb711c;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет связи с сервером</h1>
      <p>
        Проверьте интернет-соединение. После восстановления связи повторите
        попытку.
      </p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
