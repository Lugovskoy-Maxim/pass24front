<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pass · Mstyle v2 console</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #111418;
      --elev: #161a1f;
      --line: #262b32;
      --text: #d7dde5;
      --dim: #7d8693;
      --acc: #6ea0ff;
      --ok: #5ecf9a;
      --bad: #f07178;
      --get: #6ea0ff;
      --post: #5ecf9a;
      --patch: #d4b15a;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 var(--sans);
      overflow: hidden;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 52px 1fr;
    }
    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
    }
    .brand b { font-size: 13px; letter-spacing: .02em; font-weight: 600; }
    .brand span { color: var(--dim); font-size: 11px; font-family: var(--mono); }
    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      height: 32px;
      padding: 0 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .field label {
      color: var(--dim);
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      flex: none;
    }
    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      outline: none;
      font-family: var(--mono);
      font-size: 12px;
    }
    .field.cid { flex: 0 0 240px; }
    .actions { display: flex; gap: 6px; }
    .btn {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--elev);
    }
    .btn:hover { border-color: #3a414c; }
    .btn.primary { background: #1c2a44; border-color: #2d4570; color: #cfe0ff; }
    .btn:disabled { opacity: .45; cursor: wait; }
    .work {
      display: grid;
      grid-template-columns: 420px 1fr;
      min-height: 0;
    }
    .col {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 36px 1fr;
    }
    .col.req { border-right: 1px solid var(--line); }
    .col-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .req-body {
      display: grid;
      grid-template-rows: 168px auto 1fr;
      min-height: 0;
    }
    #list { overflow: auto; border-bottom: 1px solid var(--line); }
    .ep {
      display: grid;
      grid-template-columns: 44px 40px minmax(0,1fr) 36px 34px;
      gap: 6px;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid #1a1e24;
      cursor: pointer;
    }
    .ep:hover { background: #14181d; }
    .ep.on { background: #182030; }
    .id, .m, .st { font-family: var(--mono); font-size: 11px; }
    .id { color: var(--dim); }
    .m.GET { color: var(--get); }
    .m.POST { color: var(--post); }
    .m.PATCH { color: var(--patch); }
    .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms { color: var(--dim); font-size: 10px; }
    .st.ok { color: var(--ok); }
    .st.bad { color: var(--bad); }
    .editor { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      word-break: break-all;
    }
    .title { font-size: 13px; font-weight: 600; }
    textarea {
      flex: 1;
      min-height: 80px;
      resize: none;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
    }
    .ids {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 8px;
      overflow: auto;
      max-height: 120px;
    }
    .ids label { display: block; color: var(--dim); font-size: 10px; }
    .ids input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 6px;
      font-family: var(--mono);
      font-size: 11px;
    }
    .res { background: #0d0f12; }
    #log { overflow: auto; padding: 10px; }
    .item {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 8px;
      background: var(--panel);
    }
    .item .h {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #1c2128;
    }
    .item .h .meta { color: var(--dim); font-family: var(--mono); font-size: 11px; }
    .item pre {
      margin: 0;
      padding: 10px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      font: 12px/1.45 var(--mono);
    }
    .empty {
      color: var(--dim);
      padding: 40px 16px;
      text-align: center;
      font-size: 12px;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .note { font-size: 11px; color: var(--dim); max-width: 360px; text-align: right; }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .app, .work, .col, .req-body { display: block; height: auto; }
      .req-body #list { height: 220px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <b>PASS / MSTYLE</b>
      <span>private api v2</span>
    </div>
    <div class="bar">
      <div class="field">
        <label>base</label>
        <input id="base" value="https://pass.mstyle.ru" spellcheck="false" />
      </div>
      <div class="field cid">
        <label>client</label>
        <input id="clientId" value="mstyle-backend-staging" spellcheck="false" />
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="connect">Connect + probe</button>
      <button class="btn" id="send">Send</button>
      <button class="btn" id="curl">curl</button>
    </div>
  </header>
  <div class="work">
    <section class="col req">
      <div class="col-h">
        <span>Request</span>
        <span id="count"></span>
      </div>
      <div class="req-body">
        <div>
          <div style="display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)">
            <input id="q" placeholder="filter routes" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px" />
            <select id="ms" style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px">
              <option value="">ALL</option>
              <option>M0</option><option>M1</option><option>M2</option>
            </select>
          </div>
          <div id="list" style="height:calc(168px - 41px);overflow:auto"></div>
        </div>
        <div class="editor" style="border-bottom:1px solid var(--line)">
          <div>
            <div class="title" id="title">A-01 · token</div>
            <div class="url" id="url"></div>
          </div>
        </div>
        <div class="editor">
          <textarea id="body" spellcheck="false"></textarea>
          <details>
            <summary style="color:var(--dim);cursor:pointer;font-size:11px">path params</summary>
            <div class="ids" id="ids"></div>
          </details>
        </div>
      </div>
    </section>
    <section class="col res">
      <div class="col-h">
        <span>Responses</span>
        <span id="sum" class="note">ожидание connect</span>
      </div>
      <div id="log"><div class="empty">Слева маршрут. Connect возьмёт токен и прогонит безопасные GET.</div></div>
    </section>
  </div>
</div>
<script>
const SV = "2.0";
const CTX = { ipAddress: "192.0.2.10", userAgent: "pass-console/1", locale: "ru-RU" };
const P = "/internal/integrations/mstyle/v2";
const EPS = [
  { id:"A-01", ms:"M0", t:"token", m:"POST", p:"/oauth2/token", form:true, safe:1 },
  { id:"A-02", ms:"M1", t:"password verify", m:"POST", p:P+"/auth/residents/password-verify", idem:1, b:{schemaVersion:SV,login:"admin",password:"admin123",context:CTX} },
  { id:"A-03", ms:"M0", t:"code challenge", m:"POST", p:P+"/auth/residents/code-challenges", idem:1, b:{schemaVersion:SV,identifier:{type:"phone",value:"+79990001234"},channel:"sms",context:CTX} },
  { id:"A-04", ms:"M0", t:"challenge status", m:"GET", p:P+"/auth/residents/code-challenges/{challengeId}" },
  { id:"A-05", ms:"M0", t:"resend code", m:"POST", p:P+"/auth/residents/code-challenges/{challengeId}/resend", idem:1 },
  { id:"A-06", ms:"M0", t:"verify code", m:"POST", p:P+"/auth/residents/code-challenges/{challengeId}/verify", idem:1, b:{schemaVersion:SV,code:"123456",context:CTX} },
  { id:"R-01", ms:"M0", t:"resident context", m:"GET", p:P+"/residents/{subject}/context", safe:1, need:["subject"] },
  { id:"R-03", ms:"M2", t:"change feed", m:"GET", p:P+"/changes?after={cursor}&limit=50", safe:1 },
  { id:"R-04", ms:"M0", t:"profile", m:"GET", p:P+"/resident-profiles/{profileId}", safe:1, need:["profileId"] },
  { id:"R-05", ms:"M0", t:"patch profile", m:"PATCH", p:P+"/resident-profiles/{profileId}", b:{schemaVersion:SV,companyShortName:"Пример+",expectedRevision:2} },
  { id:"R-06", ms:"M1", t:"search profiles", m:"POST", p:P+"/resident-profiles/search", safe:1, b:{schemaVersion:SV,query:"",limit:20} },
  { id:"R-07", ms:"M0", t:"patch identity", m:"PATCH", p:P+"/residents/{subject}/identity", b:{schemaVersion:SV,displayName:"Иванов И. И.",expectedRevision:4} },
  { id:"R-08", ms:"M1", t:"onboarding", m:"POST", p:P+"/resident-onboarding", b:{schemaVersion:SV,phone:"+79990001234",profileType:"company",legalForm:"ooo",company:"ООО Пример"} },
  { id:"R-09", ms:"M1", t:"lifecycle", m:"POST", p:P+"/resident-profiles/{profileId}/lifecycle-transitions", b:{schemaVersion:SV,transition:"suspend",reason:"manual"} },
  { id:"R-10", ms:"M2", t:"deletion request", m:"POST", p:P+"/resident-profiles/{profileId}/deletion-requests", b:{schemaVersion:SV,reason:"client_request"} },
  { id:"R-11", ms:"M1", t:"change request", m:"POST", p:P+"/resident-profiles/{profileId}/change-requests", b:{schemaVersion:SV,patch:{companyShortName:"Новое"}} },
  { id:"R-12", ms:"M1", t:"current change", m:"GET", p:P+"/resident-profiles/{profileId}/change-requests/current", safe:1, need:["profileId"] },
  { id:"R-13", ms:"M1", t:"physical access", m:"GET", p:P+"/resident-profiles/{profileId}/physical-access", safe:1, need:["profileId"] },
  { id:"R-14", ms:"M1", t:"identity", m:"GET", p:P+"/identities/{subject}", safe:1, need:["subject"] },
  { id:"R-15", ms:"M1", t:"decide change", m:"POST", p:P+"/resident-profile-change-requests/{changeRequestId}/decisions", b:{schemaVersion:SV,decision:"approve"} },
  { id:"R-16", ms:"M1", t:"cancel change", m:"POST", p:P+"/resident-profile-change-requests/{changeRequestId}/cancel" },
  { id:"R-17", ms:"M2", t:"deletion status", m:"GET", p:P+"/deletion-requests/{deletionRequestId}", need:["deletionRequestId"] },
  { id:"M-01", ms:"M0", t:"memberships", m:"GET", p:P+"/resident-profiles/{profileId}/memberships", safe:1, need:["profileId"] },
  { id:"M-02", ms:"M0", t:"add member", m:"POST", p:P+"/resident-profiles/{profileId}/memberships", b:{schemaVersion:SV,subject:"usr_01EMPLOYEE",role:"employee"} },
  { id:"M-03", ms:"M1", t:"patch membership", m:"PATCH", p:P+"/resident-memberships/{membershipId}", b:{schemaVersion:SV,status:"suspended"} },
  { id:"M-04", ms:"M1", t:"revoke membership", m:"POST", p:P+"/resident-memberships/{membershipId}/revoke" },
  { id:"M-05", ms:"M1", t:"owner transfer", m:"POST", p:P+"/resident-profiles/{profileId}/owner-transfer", b:{schemaVersion:SV,toSubject:"usr_01NEWOWNER"} },
  { id:"C-01", ms:"M0", t:"contact challenge", m:"POST", p:P+"/residents/{subject}/contacts/challenges", b:{schemaVersion:SV,type:"phone",value:"+79990001234"} },
  { id:"C-02", ms:"M0", t:"verify contact", m:"POST", p:P+"/residents/{subject}/contacts/challenges/{challengeId}/verify", b:{schemaVersion:SV,code:"123456"} },
  { id:"C-03", ms:"M0", t:"assignments", m:"GET", p:P+"/resident-profiles/{profileId}/contact-assignments", safe:1, need:["profileId"] },
  { id:"C-04", ms:"M0", t:"replace assignments", m:"PATCH", p:P+"/resident-profiles/{profileId}/contact-assignments", b:{schemaVersion:SV,phoneContactId:"cnt_phone",emailContactId:"cnt_email"} },
  { id:"C-05", ms:"M0", t:"reveal contacts", m:"POST", p:P+"/residents/{subject}/contacts/reveal", safe:1, need:["subject"] },
  { id:"S-01", ms:"M0", t:"consents", m:"GET", p:P+"/residents/{subject}/consents", safe:1, need:["subject"] },
  { id:"S-02", ms:"M0", t:"accept consent", m:"POST", p:P+"/residents/{subject}/consents/{documentCode}/accept", b:{schemaVersion:SV,documentVersion:"1.0",documentDigest:"sha256:abc"} },
  { id:"S-03", ms:"M0", t:"withdraw consent", m:"POST", p:P+"/residents/{subject}/consents/{documentCode}/withdraw" },
  { id:"P-01", ms:"M0", t:"private-data status", m:"GET", p:P+"/resident-profiles/{profileId}/private-data/status", safe:1, need:["profileId"] },
  { id:"P-02", ms:"M0", t:"reveal private-data", m:"POST", p:P+"/resident-profiles/{profileId}/private-data/reveal", safe:1, need:["profileId"], b:{schemaVersion:SV,fieldCodes:["inn","ogrn"]} },
  { id:"P-03", ms:"M0", t:"patch private-data", m:"PATCH", p:P+"/resident-profiles/{profileId}/private-data", b:{schemaVersion:SV,values:{companyFullName:"ООО Пример",inn:"7700000000",ogrn:"1027700000000"}} },
  { id:"P-04", ms:"M0", t:"snapshot", m:"POST", p:P+"/resident-profiles/{profileId}/private-data/snapshots" },
  { id:"P-05", ms:"M1", t:"reveal profile contacts", m:"POST", p:P+"/resident-profiles/{profileId}/contacts/reveal", safe:1, need:["profileId"] },
  { id:"P-06", ms:"M1", t:"reveal snapshot", m:"POST", p:P+"/private-data-snapshots/{snapshotId}/reveal", need:["snapshotId"], b:{schemaVersion:SV,fieldCodes:["inn"]} },
  { id:"P-07", ms:"M1", t:"reveal snapshot contacts", m:"POST", p:P+"/private-data-snapshots/{snapshotId}/contacts/reveal", need:["snapshotId"] },
  { id:"P-08", ms:"M0", t:"bind snapshot", m:"POST", p:P+"/private-data-snapshots/{snapshotId}/operation-bindings", b:{schemaVersion:SV,operationType:"pass_issue",operationId:"pass_01J5"} },
  { id:"G-01", ms:"M0", t:"create guest", m:"POST", p:P+"/guest-parties", b:{schemaVersion:SV,visitorName:"Петров Пётр",visitDate:"2026-08-20"} },
  { id:"G-02", ms:"M0", t:"guest contact challenge", m:"POST", p:P+"/guest-parties/{guestPartyId}/contact-challenges", b:{schemaVersion:SV,type:"phone",value:"+79990005555"} },
  { id:"G-03", ms:"M0", t:"verify guest contact", m:"POST", p:P+"/guest-parties/{guestPartyId}/contact-challenges/{challengeId}/verify", b:{schemaVersion:SV,code:"123456"} },
  { id:"G-04", ms:"M0", t:"guest status", m:"GET", p:P+"/guest-parties/{guestPartyId}/status", safe:1, need:["guestPartyId"] },
  { id:"G-05", ms:"M1", t:"reveal guest contacts", m:"POST", p:P+"/guest-parties/{guestPartyId}/contacts/reveal", safe:1, need:["guestPartyId"] },
  { id:"G-06", ms:"M0", t:"guest private-data status", m:"GET", p:P+"/guest-parties/{guestPartyId}/private-data/status", safe:1, need:["guestPartyId"] },
  { id:"G-07", ms:"M1", t:"reveal guest private-data", m:"POST", p:P+"/guest-parties/{guestPartyId}/private-data/reveal", safe:1, need:["guestPartyId"], b:{schemaVersion:SV,fieldCodes:["lastName","firstName"]} },
  { id:"G-08", ms:"M0", t:"patch guest private-data", m:"PATCH", p:P+"/guest-parties/{guestPartyId}/private-data", b:{schemaVersion:SV,values:{lastName:"Петров",firstName:"Пётр"}} },
  { id:"G-09", ms:"M0", t:"guest snapshot", m:"POST", p:P+"/guest-parties/{guestPartyId}/snapshots" },
  { id:"G-10", ms:"M0", t:"confirm booking", m:"POST", p:P+"/guest-parties/{guestPartyId}/booking-confirmations", b:{schemaVersion:SV,visitDate:"2026-08-20",officeExternalId:"tf-room:107"} },
  { id:"G-11", ms:"M2", t:"claim guest", m:"POST", p:P+"/guest-parties/{guestPartyId}/claim", b:{schemaVersion:SV,subject:"usr_01J5Q8K2M7N4P6R9T1V3X5Z7AA"} },
  { id:"G-12", ms:"M1", t:"search guests", m:"POST", p:P+"/guest-parties/search", safe:1, b:{schemaVersion:SV,query:"",limit:20} },
  { id:"G-13", ms:"M0", t:"guest consents", m:"GET", p:P+"/guest-parties/{guestPartyId}/consents", safe:1, need:["guestPartyId"] },
  { id:"G-14", ms:"M0", t:"accept guest consent", m:"POST", p:P+"/guest-parties/{guestPartyId}/consents/{documentCode}/accept", b:{schemaVersion:SV,documentVersion:"1.0",documentDigest:"sha256:abc"} },
  { id:"G-15", ms:"M0", t:"withdraw guest consent", m:"POST", p:P+"/guest-parties/{guestPartyId}/consents/{documentCode}/withdraw" }
];
const VARS = ["subject","profileId","challengeId","membershipId","guestPartyId","snapshotId","changeRequestId","deletionRequestId","documentCode","cursor"];
const $ = (id) => document.getElementById(id);
let cur = EPS[0], token = "", last = {}, busy = false;

$("ids").innerHTML = VARS.map(k => `<div><label>${k}</label><input id="v-${k}" ${k==="documentCode"?'value="pdn"':""} /></div>`).join("");

function apiRoot() {
  let u = ($("base").value.trim() || location.origin).replace(/\/+$/, "");
  if (!/\/api$/i.test(u)) u += "/api";
  return u;
}
function fill(path) {
  return path.replace(/\{(\w+)\}/g, (_, k) => encodeURIComponent(($("v-"+k)||{}).value || "{"+k+"}"));
}
function fullUrl(ep) {
  const path = fill(ep.p).replace(/^\/api(?=\/|$)/, "");
  return apiRoot() + (path.startsWith("/") ? path : "/" + path);
}
function missing(ep) { return (ep.need || []).filter(k => !$("v-"+k).value.trim()); }
function rid() { return "req_" + Math.random().toString(36).slice(2, 10); }
function pick(ep) {
  cur = ep;
  $("title").textContent = ep.id + " · " + ep.t;
  $("body").value = ep.b ? JSON.stringify(ep.b, null, 2) : "";
  $("body").disabled = ep.m === "GET" && !ep.b;
  $("url").textContent = ep.m + "  " + fullUrl(ep);
  render();
}
function render() {
  const q = $("q").value.toLowerCase();
  const ms = $("ms").value;
  const shown = EPS.filter(e => (!ms || e.ms === ms) && (!q || (e.id+" "+e.t+" "+e.p).toLowerCase().includes(q)));
  $("count").textContent = shown.length + "/" + EPS.length;
  $("list").innerHTML = shown.map(e => {
    const r = last[e.id];
    return `<div class="ep ${cur.id===e.id?"on":""}" data-id="${e.id}">
      <span class="id">${e.id}</span><span class="m ${e.m}">${e.m}</span>
      <span class="t">${e.t}</span><span class="ms">${e.ms}</span>
      <span class="st ${r? (r.ok?"ok":"bad"):""}">${r?r.status:""}</span></div>`;
  }).join("");
}
function harvest(o) {
  if (!o || typeof o !== "object") return;
  const map = { access_token:"_tok", subject:"v-subject", profileId:"v-profileId", challengeId:"v-challengeId",
    membershipId:"v-membershipId", guestPartyId:"v-guestPartyId", snapshotId:"v-snapshotId",
    changeRequestId:"v-changeRequestId", deletionRequestId:"v-deletionRequestId" };
  for (const [k,id] of Object.entries(map)) {
    if (typeof o[k] !== "string" || !o[k]) continue;
    if (id === "_tok") token = o[k];
    else if (!$(id).value) $(id).value = o[k];
  }
  if (o.identity?.subject && !$("v-subject").value) $("v-subject").value = o.identity.subject;
  if (o.profiles?.[0]?.profileId && !$("v-profileId").value) $("v-profileId").value = o.profiles[0].profileId;
  if (o.items?.[0]?.profileId && !$("v-profileId").value) $("v-profileId").value = o.items[0].profileId;
  if (o.items?.[0]?.id && String(o.items[0].id).startsWith("prf_") && !$("v-profileId").value) $("v-profileId").value = o.items[0].id;
  if (o.items?.[0]?.guestPartyId && !$("v-guestPartyId").value) $("v-guestPartyId").value = o.items[0].guestPartyId;
  if (o.membership?.id && !$("v-membershipId").value) $("v-membershipId").value = o.membership.id;
  Object.values(o).forEach(v => { if (v && typeof v === "object") harvest(v); });
}
function explain(ep, status, data) {
  if (ep.id === "A-01" && status === 404) {
    return "Маршрут скрыт: MSTYLE_PRIVATE_API_ENABLED не попал в контейнер backend (пропишите в docker-compose и перезапустите).";
  }
  if (data && data.error === "invalid_client") return "client_id ≠ MSTYLE_CLIENT_ID";
  return "";
}
function addLog(ep, status, ok, ms, body, url) {
  last[ep.id] = { status, ok };
  const empty = $("log").querySelector(".empty");
  if (empty) empty.remove();
  const box = document.createElement("article");
  box.className = "item";
  const text = typeof body === "string" ? body : JSON.stringify(body, null, 2);
  const hint = explain(ep, status, body);
  box.innerHTML = `<div class="h">
      <div><b>${ep.id}</b> ${ep.t}<div class="meta">${ep.m} ${url}</div>${hint?`<div class="meta">${hint}</div>`:""}</div>
      <div class="${ok?"ok":"bad"}">${status||"ERR"} · ${ms}ms</div>
    </div>
    <pre>${text.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</pre>`;
  box.querySelector(".h").onclick = () => pick(ep);
  $("log").appendChild(box);
  box.scrollIntoView({ block: "end" });
  const vals = Object.values(last);
  $("sum").innerHTML = `<span class="ok">${vals.filter(x=>x.ok).length} ok</span> / <span class="bad">${vals.filter(x=>!x.ok).length} fail</span>`;
  render();
}
async function call(ep, silent) {
  if (!silent) pick(ep);
  const url = fullUrl(ep);
  $("url").textContent = ep.m + "  " + url;
  const headers = { Accept: "application/json", "X-Request-ID": rid() };
  if (!ep.form && token) headers.Authorization = "Bearer " + token;
  if (ep.idem) headers["Idempotency-Key"] = "idem_" + Date.now().toString(36);
  let body;
  if (ep.form) {
    headers["Content-Type"] = "application/x-www-form-urlencoded";
    const p = new URLSearchParams();
    p.set("grant_type", "client_credentials");
    p.set("client_id", $("clientId").value.trim() || "mstyle-backend-staging");
    body = p.toString();
  } else if (ep.m !== "GET") {
    headers["Content-Type"] = "application/json";
    body = silent && ep.b ? JSON.stringify(ep.b) : ($("body").value || "{}");
  }
  const t0 = performance.now();
  try {
    const res = await fetch(url, { method: ep.m, headers, body });
    const raw = await res.text();
    let data = raw;
    try { data = JSON.parse(raw); } catch {}
    if (data && typeof data === "object") harvest(data);
    addLog(ep, res.status, res.ok, Math.round(performance.now() - t0), data, url);
    return res.ok;
  } catch (e) {
    addLog(ep, 0, false, 0, e.message, url);
    return false;
  }
}
async function auto() {
  if (busy) return;
  busy = true;
  $("connect").disabled = true;
  $("send").disabled = true;
  $("log").innerHTML = "";
  last = {};
  $("sum").textContent = "running";
  const ok = await call(EPS[0], true);
  if (ok && token) {
    for (const ep of EPS.filter(e => e.safe && e.id !== "A-01")) {
      if (missing(ep).length) continue;
      await call(ep, true);
    }
  }
  busy = false;
  $("connect").disabled = false;
  $("send").disabled = false;
}
function copyCurl() {
  const ep = cur;
  const h = ["-H 'Accept: application/json'", "-H 'X-Request-ID: "+rid()+"'"];
  if (!ep.form && token) h.push("-H 'Authorization: Bearer "+token+"'");
  if (ep.idem) h.push("-H 'Idempotency-Key: idem_"+Date.now().toString(36)+"'");
  let data = "";
  if (ep.form) data = " --data 'grant_type=client_credentials&client_id="+($("clientId").value.trim()||"mstyle-backend-staging")+"'";
  else if (ep.m !== "GET") data = " --data '"+$("body").value.replace(/'/g,"'\\''")+"'";
  navigator.clipboard.writeText("curl -sS -X "+ep.m+" '"+fullUrl(ep)+"' "+h.join(" ")+data);
}
if (location.protocol.startsWith("http") && /pass\.mstyle\.ru$/.test(location.hostname)) $("base").value = location.origin;
$("list").onclick = (e) => { const r = e.target.closest(".ep"); if (r) pick(EPS.find(x => x.id === r.dataset.id)); };
$("q").oninput = $("ms").onchange = render;
$("base").oninput = () => { $("url").textContent = cur.m + "  " + fullUrl(cur); };
$("send").onclick = () => call(cur);
$("connect").onclick = auto;
$("curl").onclick = copyCurl;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); call(cur); }
});
render();
pick(EPS[0]);
</script>
