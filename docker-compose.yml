services:
  # MongoDB database
  mongo:
    image: mongo:7-jammy
    container_name: pass24-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pass24
    volumes:
      # Named volume — стабильнее на Windows, чем bind mount ./data/mongo
      - mongo_data:/data/db
      # Initialization script (runs only on first container start)
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Local SMTP catcher (web UI: http://127.0.0.1:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: pass24-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pass24-backend
    restart: unless-stopped
    ports:
      # Только IPv4: localhost на Windows уходит в ::1 и зависает
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/pass24
      - MONGODB_AUTH_URI=mongodb://mongo:27017/pass24_auth
      - JWT_SECRET=pass24-super-secret-key-2026
      - JWT_EXPIRES_IN=7d
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=01.03.1986
      - ADMIN_FULL_NAME=Админ
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_SECURE=false
      - SMTP_FROM=Пропуск.М-Стиль <noreply@pass24.local>
      - SMSAERO_EMAIL=${SMSAERO_EMAIL:-}
      - SMSAERO_API_KEY=${SMSAERO_API_KEY:-}
      - SMSAERO_SIGN=${SMSAERO_SIGN:-SMS Aero}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - SMSAERO_CALLBACK_URL=${SMSAERO_CALLBACK_URL:-}
      - PUBLIC_APP_URL=http://127.0.0.1:3001
      - TZ=Europe/Moscow
      - MSTYLE_PRIVATE_API_ENABLED=${MSTYLE_PRIVATE_API_ENABLED:-false}
      - MSTYLE_CLIENT_ID=${MSTYLE_CLIENT_ID:-mstyle-backend-staging}
      - MSTYLE_CLIENT_AUTH=${MSTYLE_CLIENT_AUTH:-mtls}
      - MSTYLE_CLIENT_PUBLIC_KEY=${MSTYLE_CLIENT_PUBLIC_KEY:-}
      - MSTYLE_CLIENT_PUBLIC_KEY_FILE=${MSTYLE_CLIENT_PUBLIC_KEY_FILE:-}
      - MSTYLE_CLIENT_SCOPES=${MSTYLE_CLIENT_SCOPES:-}
      - MSTYLE_RECONCILE_CLIENT_ID=${MSTYLE_RECONCILE_CLIENT_ID:-}
      - MSTYLE_RECONCILE_CLIENT_AUTH=${MSTYLE_RECONCILE_CLIENT_AUTH:-private_key_jwt}
      - MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY=${MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY:-}
      - MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY_FILE=${MSTYLE_RECONCILE_CLIENT_PUBLIC_KEY_FILE:-}
      - MSTYLE_PII_KEY=${MSTYLE_PII_KEY:-}
      - MSTYLE_IDEMPOTENCY_SECRET=${MSTYLE_IDEMPOTENCY_SECRET:-}
      - MSTYLE_MOCK_RESPONSES=${MSTYLE_MOCK_RESPONSES:-}
      - MSTYLE_DISPATCH_ENABLED=${MSTYLE_DISPATCH_ENABLED:-false}
      - MSTYLE_MOCK_OTP=${MSTYLE_MOCK_OTP:-1234}
      - MSTYLE_ENVIRONMENT=${MSTYLE_ENVIRONMENT:-staging}
      - MSTYLE_PUBLIC_BASE_URL=${MSTYLE_PUBLIC_BASE_URL:-}
      - TELEGRAM_GATEWAY_URL=${TELEGRAM_GATEWAY_URL:-}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      - MSTYLE_TELEGRAM_BOT=${MSTYLE_TELEGRAM_BOT:-mstyleauthbot}
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend/config/oauth-public-keys:/app/config/oauth-public-keys:ro
    # For development hot-reload (uncomment if needed):
    # command: npm run start:dev
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules

  # WireGuard client — только для Telegram Bot API egress.
  # Поднимать с: docker compose --profile telegram up -d
  wireguard:
    profiles: ["telegram"]
    image: lscr.io/linuxserver/wireguard:latest
    container_name: pass24-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - ./docker/wireguard:/config
    ports:
      # HTTP API telegram-gateway слушает в общем netns
      - "127.0.0.1:8091:8091"
    devices:
      - /dev/net/tun:/dev/net/tun

  # Telegram OTP gateway (Bot API через WireGuard)
  telegram-gateway:
    profiles: ["telegram"]
    build:
      context: ./docker/telegram-gateway
      dockerfile: Dockerfile
    container_name: pass24-telegram-gateway
    restart: unless-stopped
    network_mode: "service:wireguard"
    environment:
      - PORT=8091
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      - TELEGRAM_POLL=${TELEGRAM_POLL:-true}
    depends_on:
      - wireguard

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
    container_name: pass24-frontend
    restart: unless-stopped
    ports:
      # Только IPv4: на Windows localhost → ::1, а Docker IPv6-проброс часто зависает
      - "127.0.0.1:3001:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:4000/api
    depends_on:
      - backend
    # For development hot-reload (uncomment if needed):
    # command: npm run dev
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    #   - /app/.next

volumes:
  mongo_data:
