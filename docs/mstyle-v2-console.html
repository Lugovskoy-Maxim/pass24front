<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pass API console · v1 / v2</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #111418;
      --elev: #161a1f;
      --line: #262b32;
      --text: #d7dde5;
      --dim: #7d8693;
      --ok: #5ecf9a;
      --bad: #f07178;
      --get: #6ea0ff;
      --post: #5ecf9a;
      --patch: #d4b15a;
      --del: #f07178;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --left: 430px;
      --list: 200px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 var(--sans);
      overflow: hidden;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .brand { display: flex; align-items: baseline; gap: 8px; margin-right: 8px; }
    .brand b { font-size: 13px; letter-spacing: .03em; }
    .brand span { color: var(--dim); font: 11px var(--mono); }
    .tabs { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .tabs button { height: 30px; padding: 0 12px; border: 0; background: transparent; color: var(--dim); }
    .tabs button.on { background: #1c2430; color: var(--text); }
    .field {
      display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-width: 0;
    }
    .field label { color: var(--dim); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; flex: none; }
    .field input { border: 0; background: transparent; outline: none; font: 12px var(--mono); min-width: 80px; width: 100%; }
    .field.base { flex: 1; min-width: 180px; }
    .btn {
      height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--elev);
    }
    .btn.primary { background: #1c2a44; border-color: #2d4570; color: #cfe0ff; }
    .btn:disabled { opacity: .45; cursor: wait; }
    .work {
      display: grid;
      grid-template-columns: var(--left) 6px 1fr;
      min-height: 0;
    }
    .vsplit, .hsplit { background: var(--line); }
    .vsplit { cursor: col-resize; }
    .hsplit { cursor: row-resize; }
    .vsplit:hover, .hsplit:hover, .vsplit.on, .hsplit.on { background: #3d4654; }
    .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .col-h {
      height: 32px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; border-bottom: 1px solid var(--line); color: var(--dim);
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase; flex: none;
    }
    .req-stack { flex: 1; min-height: 0; display: grid; grid-template-rows: var(--list) 6px 1fr; }
    #list { overflow: auto; }
    .tools { display: flex; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .tools input, .tools select {
      background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; font: 12px var(--mono);
    }
    .tools input { flex: 1; }
    .ep {
      display: grid; grid-template-columns: 52px 44px minmax(0,1fr) 28px 32px;
      gap: 6px; align-items: center; padding: 5px 8px; border-bottom: 1px solid #1a1e24; cursor: pointer;
    }
    .ep:hover { background: #14181d; }
    .ep.on { background: #182030; }
    .id, .m, .st { font: 11px var(--mono); }
    .id { color: var(--dim); }
    .m.GET { color: var(--get); } .m.POST { color: var(--post); }
    .m.PATCH { color: var(--patch); } .m.DELETE { color: var(--del); }
    .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms { color: var(--dim); font-size: 10px; }
    .st.ok { color: var(--ok); } .st.bad { color: var(--bad); }
    .editor { min-height: 0; display: flex; flex-direction: column; padding: 8px 10px; gap: 6px; }
    .url { font: 11px var(--mono); color: var(--dim); word-break: break-all; }
    textarea {
      flex: 1; min-height: 70px; resize: none; background: var(--bg); border: 1px solid var(--line);
      border-radius: 5px; padding: 7px; font: 12px var(--mono); outline: none;
    }
    .ids { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; overflow: auto; max-height: 110px; }
    .ids label { display: block; color: var(--dim); font-size: 10px; }
    .ids input {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 6px; font: 11px var(--mono);
    }
    .res { background: #0d0f12; }
    #log { flex: 1; overflow: auto; padding: 8px; }
    .item { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 7px; background: var(--panel); }
    .item .h { display: flex; justify-content: space-between; gap: 8px; padding: 7px 9px; cursor: pointer; border-bottom: 1px solid #1c2128; }
    .item .meta { color: var(--dim); font: 11px var(--mono); }
    .item pre { margin: 0; padding: 8px 9px; max-height: 220px; overflow: auto; white-space: pre-wrap; font: 12px/1.4 var(--mono); }
    .empty { color: var(--dim); padding: 36px 14px; text-align: center; font-size: 12px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .ver { font: 10px var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>PASS</b><span>http console</span></div>
    <div class="tabs">
      <button type="button" id="tab-v1" class="on">v1 app</button>
      <button type="button" id="tab-v2">v2 mstyle</button>
    </div>
    <div class="field base"><label>base</label><input id="base" value="https://pass.mstyle.ru" spellcheck="false" /></div>
    <div class="field" style="width:200px"><label>client</label><input id="clientId" value="mstyle-backend-staging" spellcheck="false" /></div>
    <div class="field" style="width:150px"><label>login</label><input id="login" value="admin" spellcheck="false" /></div>
    <div class="field" style="width:140px"><label>pass</label><input id="password" type="password" value="" /></div>
    <button class="btn primary" id="connect">Connect + probe</button>
    <button class="btn" id="send">Send</button>
    <button class="btn" id="curl">curl</button>
  </header>
  <div class="work">
    <section class="col">
      <div class="col-h"><span>Request</span><span id="count"></span></div>
      <div class="req-stack">
        <div style="min-height:0;display:flex;flex-direction:column">
          <div class="tools">
            <input id="q" placeholder="filter" />
            <select id="grp"><option value="">all groups</option></select>
          </div>
          <div id="list"></div>
        </div>
        <div class="hsplit" id="hsplit" title="высота списка"></div>
        <div class="editor">
          <div>
            <div id="title" style="font-weight:600">—</div>
            <div class="url" id="url"></div>
          </div>
          <textarea id="body" spellcheck="false"></textarea>
          <details>
            <summary style="color:var(--dim);cursor:pointer;font-size:11px">path params</summary>
            <div class="ids" id="ids"></div>
          </details>
        </div>
      </div>
    </section>
    <div class="vsplit" id="vsplit" title="ширина колонок"></div>
    <section class="col res">
      <div class="col-h"><span>Responses</span><span id="sum">idle</span></div>
      <div id="log"><div class="empty">v1 — JWT после login. v2 — service token после A-01. Connect прогоняет безопасные чтения выбранной версии.</div></div>
    </section>
  </div>
</div>

  {id:"G-06",g:"guests",t:"private-data status",m:"GET",p:P+"/guest-parties/{guestPartyId}/private-data/status",safe:1,need:["guestPartyId"]},
  {id:"G-07",g:"guests",t:"reveal private-data",m:"POST",p:P+"/guest-parties/{guestPartyId}/private-data/reveal",safe:1,need:["guestPartyId"],b:{schemaVersion:SV,fieldCodes:["lastName","firstName"]}},
  {id:"G-08",g:"guests",t:"patch private-data",m:"PATCH",p:P+"/guest-parties/{guestPartyId}/private-data",b:{schemaVersion:SV,values:{lastName:"Петров",firstName:"Пётр"}}},
  {id:"G-09",g:"guests",t:"snapshot",m:"POST",p:P+"/guest-parties/{guestPartyId}/snapshots"},
  {id:"G-10",g:"guests",t:"confirm booking",m:"POST",p:P+"/guest-parties/{guestPartyId}/booking-confirmations",b:{schemaVersion:SV,visitDate:"2026-08-20",officeExternalId:"tf-room:107"}},
  {id:"G-11",g:"guests",t:"claim",m:"POST",p:P+"/guest-parties/{guestPartyId}/claim",b:{schemaVersion:SV,subject:"usr_01J5Q8K2M7N4P6R9T1V3X5Z7AA"}},
  {id:"G-12",g:"guests",t:"search",m:"POST",p:P+"/guest-parties/search",safe:1,b:{schemaVersion:SV,query:{},limit:20}},
  {id:"G-13",g:"guests",t:"consents",m:"GET",p:P+"/guest-parties/{guestPartyId}/consents",safe:1,need:["guestPartyId"]},
  {id:"G-14",g:"guests",t:"accept consent",m:"POST",p:P+"/guest-parties/{guestPartyId}/consents/{documentCode}/accept",b:{schemaVersion:SV,documentVersion:"1.0",documentDigest:"sha256:abc"}},
  {id:"G-15",g:"guests",t:"withdraw consent",m:"POST",p:P+"/guest-parties/{guestPartyId}/consents/{documentCode}/withdraw"}
].map(e => ({...e, ver:"v2"}));
const ALL = [...V1, ...V2];
const VARS = ["id","token","passNumber","passId","registrationId","resetToken","subject","profileId","challengeId","membershipId","guestPartyId","snapshotId","changeRequestId","deletionRequestId","documentCode","cursor"];
const $ = (id) => document.getElementById(id);
let ver = "v1", cur = V1[0], jwt = "", svc = "", last = {}, busy = false;

$("ids").innerHTML = VARS.map(k => `<div><label>${k}</label><input id="v-${k}" ${k==="documentCode"?'value="pdn"':""}></div>`).join("");

function eps() { return ALL.filter(e => e.ver === ver); }
function apiRoot() {
  let u = ($("base").value.trim() || location.origin).replace(/\/+$/, "");
  if (!/\/api$/i.test(u)) u += "/api";
  return u;
}
function fill(path) {
  return path.replace(/\{(\w+)\}/g, (_, k) => encodeURIComponent(($("v-"+k)||{}).value || "{"+k+"}"));
}
function fullUrl(ep) {
  const path = fill(ep.p === "/" ? "/" : ep.p).replace(/^\/api(?=\/|$)/, "");
  if (path === "/" || path === "") return apiRoot().replace(/\/api$/,"") + "/api";
  return apiRoot() + (path.startsWith("/") ? path : "/" + path);
}
function missing(ep) { return (ep.need||[]).filter(k => !$("v-"+k).value.trim()); }
function rid() { return "req_" + Math.random().toString(36).slice(2,10); }
function pick(ep) {
  cur = ep;
  $("title").innerHTML = `<span class="ver">${ep.ver}</span> ${ep.id} · ${ep.t}`;
  $("body").value = ep.b ? JSON.stringify(ep.b, null, 2) : "";
  $("body").disabled = ep.m === "GET" && !ep.b;
  $("url").textContent = ep.m + "  " + fullUrl(ep);
  render();
}
function render() {
  const q = $("q").value.toLowerCase();
  const g = $("grp").value;
  const list = eps().filter(e => (!g || e.g === g) && (!q || (e.id+" "+e.t+" "+e.p+" "+e.g).toLowerCase().includes(q)));
  $("count").textContent = list.length + "/" + eps().length;
  const groups = [...new Set(eps().map(e => e.g))];
  const sel = $("grp").value;
  $("grp").innerHTML = '<option value="">all groups</option>' + groups.map(x => `<option ${x===sel?"selected":""}>${x}</option>`).join("");
  $("list").innerHTML = list.map(e => {
    const r = last[e.ver+e.id];
    return `<div class="ep ${cur && cur.ver===e.ver && cur.id===e.id?"on":""}" data-ver="${e.ver}" data-id="${e.id}">
      <span class="id">${e.id}</span><span class="m ${e.m}">${e.m}</span>
      <span class="t">${e.t}</span><span class="ms">${e.g}</span>
      <span class="st ${r?(r.ok?"ok":"bad"):""}">${r?r.status:""}</span></div>`;
  }).join("");
}
function harvest(o) {
  if (!o || typeof o !== "object") return;
  if (typeof o.token === "string" && o.token.length > 20) jwt = o.token;
  if (typeof o.access_token === "string") svc = o.access_token;
  const map = {subject:"v-subject",profileId:"v-profileId",challengeId:"v-challengeId",membershipId:"v-membershipId",
    guestPartyId:"v-guestPartyId",snapshotId:"v-snapshotId",changeRequestId:"v-changeRequestId",
    deletionRequestId:"v-deletionRequestId",passNumber:"v-passNumber"};
  for (const [k,id] of Object.entries(map)) {
    if (typeof o[k] === "string" && o[k] && !$(id).value) $(id).value = o[k];
  }
  if (o.user?.id && !$("v-id").value) $("v-id").value = o.user.id;
  if (o.identity?.subject && !$("v-subject").value) $("v-subject").value = o.identity.subject;
  if (o.profiles?.[0]?.profileId && !$("v-profileId").value) $("v-profileId").value = o.profiles[0].profileId;
  if (o.items?.[0]?.id && !$("v-id").value) $("v-id").value = o.items[0].id;
  if (o.items?.[0]?.profileId && !$("v-profileId").value) $("v-profileId").value = o.items[0].profileId;
  if (o.offices?.[0]?.id && !$("v-id").value) $("v-id").value = o.offices[0].id;
  if (o.passes?.[0]?.id && !$("v-id").value) $("v-id").value = o.passes[0].id;
  if (o.passes?.[0]?.passNumber && !$("v-passNumber").value) $("v-passNumber").value = o.passes[0].passNumber;
  Object.values(o).forEach(v => { if (v && typeof v === "object") harvest(v); });
}
function explain(ep, status, data) {
  if (ep.id==="A-01" && status===404) return "v2 скрыт: MSTYLE_PRIVATE_API_ENABLED не в контейнере backend.";
  if (data && data.error==="invalid_client") return "client_id ≠ MSTYLE_CLIENT_ID";
  if (status===401 && ep.ver==="v1") return "нужен JWT — Connect с login/pass или POST /auth/login";
  return "";
}
function addLog(ep, status, ok, ms, body, url) {
  last[ep.ver+ep.id] = {status, ok};
  const empty = $("log").querySelector(".empty");
  if (empty) empty.remove();
  const box = document.createElement("article");
  box.className = "item";
  const text = typeof body === "string" ? body : JSON.stringify(body, null, 2);
  const hint = explain(ep, status, body);
  box.innerHTML = `<div class="h"><div><span class="ver">${ep.ver}</span> <b>${ep.id}</b> ${ep.t}<div class="meta">${ep.m} ${url}</div>${hint?`<div class="meta">${hint}</div>`:""}</div><div class="${ok?"ok":"bad"}">${status||"ERR"} · ${ms}ms</div></div><pre>${text.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</pre>`;
  box.querySelector(".h").onclick = () => { setVer(ep.ver, true); pick(ep); };
  $("log").appendChild(box);
  box.scrollIntoView({block:"end"});
  const vals = Object.values(last);
  $("sum").innerHTML = `<span class="ok">${vals.filter(x=>x.ok).length} ok</span> / <span class="bad">${vals.filter(x=>!x.ok).length} fail</span>`;
  render();
}
async function call(ep, silent) {
  if (!silent) pick(ep);
  const url = fullUrl(ep);
  $("url").textContent = ep.m + "  " + url;
  const headers = {Accept:"application/json","X-Request-ID":rid()};
  if (ep.form) {
    headers["Content-Type"] = "application/x-www-form-urlencoded";
  } else if (ep.m !== "GET" && ep.m !== "DELETE") {
    headers["Content-Type"] = "application/json";
  }
  if (ep.ver==="v2" && !ep.form && svc) headers.Authorization = "Bearer " + svc;
  if (ep.ver==="v1" && ep.jwt && jwt) headers.Authorization = "Bearer " + jwt;
  if (ep.idem) headers["Idempotency-Key"] = "idem_" + Date.now().toString(36);
  let body;
  if (ep.form) {
    const p = new URLSearchParams();
    p.set("grant_type","client_credentials");
    p.set("client_id", $("clientId").value.trim() || "mstyle-backend-staging");
    body = p.toString();
  } else if (ep.auth) {
    body = JSON.stringify({login:$("login").value.trim(), password:$("password").value || (ep.b&&ep.b.password) || ""});
  } else if (ep.m !== "GET" && ep.m !== "DELETE") {
    body = silent && ep.b ? JSON.stringify(ep.b) : ($("body").value || "{}");
  } else if (ep.m === "DELETE" && ep.b) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(ep.b);
  }
  const t0 = performance.now();
  try {
    const res = await fetch(url, {method: ep.m, headers, body});
    const raw = await res.text();
    let data = raw;
    try { data = JSON.parse(raw); } catch {}
    if (data && typeof data === "object") harvest(data);
    addLog(ep, res.status, res.ok, Math.round(performance.now()-t0), data, url);
    return res.ok;
  } catch (e) {
    addLog(ep, 0, false, 0, e.message, url);
    return false;
  }
}
async function auto() {
  if (busy) return;
  busy = true;
  $("connect").disabled = $("send").disabled = true;
  $("log").innerHTML = ""; last = {}; $("sum").textContent = "running";
  if (ver === "v2") {
    const tok = V2.find(e => e.id==="A-01");
    const ok = await call(tok, true);
    if (ok && svc) {
      for (const ep of V2.filter(e => e.safe && e.id!=="A-01")) {
        if (missing(ep).length) continue;
        await call(ep, true);
      }
    }
  } else {
    await call(V1.find(e=>e.id==="C-00"), true);
    await call(V1.find(e=>e.id==="H-01"), true);
    const loginEp = V1.find(e=>e.id==="A1-01");
    if ($("password").value) await call(loginEp, true);
    if (jwt) {
      for (const ep of V1.filter(e => e.safe && e.jwt)) await call(ep, true);
    }
  }
  busy = false;
  $("connect").disabled = $("send").disabled = false;
}
function copyCurl() {
  const ep = cur;
  const h = ["-H 'Accept: application/json'"];
  if (ep.ver==="v2" && !ep.form && svc) h.push("-H 'Authorization: Bearer "+svc+"'");
  if (ep.ver==="v1" && ep.jwt && jwt) h.push("-H 'Authorization: Bearer "+jwt+"'");
  let data = "";
  if (ep.form) data = " --data 'grant_type=client_credentials&client_id="+($("clientId").value.trim()||"mstyle-backend-staging")+"'";
  else if (ep.m!=="GET" && ep.m!=="DELETE") data = " --data '"+$("body").value.replace(/'/g,"'\\''")+"'";
  navigator.clipboard.writeText("curl -sS -X "+ep.m+" '"+fullUrl(ep)+"' "+h.join(" ")+data);
}
function setVer(next, keep) {
  ver = next;
  $("tab-v1").classList.toggle("on", ver==="v1");
  $("tab-v2").classList.toggle("on", ver==="v2");
  if (keep) render();
  else pick(eps()[0]);
}
function drag(el, onmove) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    el.classList.add("on");
    const move = (ev) => onmove(ev);
    const up = () => { el.classList.remove("on"); window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}
drag($("vsplit"), (e) => {
  const x = Math.min(Math.max(e.clientX, 280), window.innerWidth - 320);
  document.documentElement.style.setProperty("--left", x + "px");
});
drag($("hsplit"), (e) => {
  const top = $("list").parentElement.getBoundingClientRect().top;
  const h = Math.min(Math.max(e.clientY - top, 80), window.innerHeight - 220);
  document.documentElement.style.setProperty("--list", h + "px");
});
if (location.protocol.startsWith("http") && /pass\.mstyle\.ru$/.test(location.hostname)) $("base").value = location.origin;
$("tab-v1").onclick = () => setVer("v1");
$("tab-v2").onclick = () => setVer("v2");
$("list").onclick = (e) => {
  const r = e.target.closest(".ep");
  if (!r) return;
  setVer(r.dataset.ver, true);
  pick(ALL.find(x => x.ver===r.dataset.ver && x.id===r.dataset.id));
};
$("q").oninput = $("grp").onchange = render;
$("base").oninput = () => { $("url").textContent = cur.m+"  "+fullUrl(cur); };
$("send").onclick = () => call(cur);
$("connect").onclick = auto;
$("curl").onclick = copyCurl;
document.addEventListener("keydown", (e) => { if ((e.metaKey||e.ctrlKey) && e.key==="Enter") { e.preventDefault(); call(cur); } });
render();
pick(V1[0]);
</script>
